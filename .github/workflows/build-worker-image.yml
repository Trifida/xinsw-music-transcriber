name: Build CPU Worker Image

on:
  push:
    branches:
      - feat/manual-start-existing-gpu
    paths:
      - "Dockerfile.worker"
      - ".dockerignore"
      - "requirements/locks/**"
      - "vendor/crepe/**"
      - "scripts/prepare_crepe_model.py"
      - "musicmaster/**"
      - ".github/workflows/build-worker-image.yml"
  pull_request:
    branches:
      - feat/manual-start-existing-gpu
    paths:
      - "Dockerfile.worker"
      - ".dockerignore"
      - "requirements/locks/**"
      - "vendor/crepe/**"
      - "scripts/prepare_crepe_model.py"
      - "musicmaster/**"
      - ".github/workflows/build-worker-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: worker-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and optionally publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.worker
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/trifida/xinsw-music-transcriber-worker:sha-${{ github.sha }}
            ghcr.io/trifida/xinsw-music-transcriber-worker:dev
          cache-from: type=gha,scope=worker-image
          cache-to: type=gha,mode=max,scope=worker-image
          provenance: false
          sbom: false
