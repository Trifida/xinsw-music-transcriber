name: tests

on:
  pull_request:
  push:
    branches:
      - main
      - feature/vocalparse-event-musicxml

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project and test/render dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,render]"

      - name: Run test suite
        run: python -m pytest
