name: Original jianpu renderer smoke test

on:
  pull_request:
    branches: [main]
    paths:
      - "musicmaster/core/render.py"
      - "musicmaster/core/vocalparse.py"
      - "tests/test_vocalparse_musicxml.py"
      - "tests/fixtures/vocalparse_25s_sample.json"
      - "scripts/render_vocalparse_json.py"
      - "musicmaster/transcribe/lyrics.py"
      - "musicmaster/transcribe/lyric_asr.py"
      - "musicmaster/web/server.py"
      - "musicmaster/web/static/index.html"
      - "musicmaster/web/static/js/transcribe.js"
      - "requirements/requirements-core.txt"
      - "tests/test_lyrics.py"
      - "tests/test_lyric_asr.py"
      - "musicmaster/web/runners.py"
      - "tests/test_musicmaster.py"
      - "examples/twinkle.jianpu"
      - ".github/workflows/jianpu-renderer-smoke.yml"
permissions:
  contents: read

jobs:
  legacy-jianpu:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install LilyPond
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lilypond
      - name: Install renderer test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[render]" pytest httpx
      - name: Verify original renderer produces real SVG and PDF
        run: python -m pytest -q tests/test_musicmaster.py -k "jianpu_download_labels or original_jianpu_renderer_generates_svg_and_pdf"
      - name: Render VocalParse MusicXML to real jianpu SVG and PDF
        run: python -m pytest -q tests/test_vocalparse_musicxml.py -k vocalparse_musicxml_renders_real_jianpu_svg_and_pdf
      - name: Render captured VocalParse sample through the offline CLI
        run: |
          python scripts/render_vocalparse_json.py tests/fixtures/vocalparse_25s_sample.json /tmp/vocalparse-25s-score
          test -s /tmp/vocalparse-25s-score/vocalparse.musicxml
          test -s /tmp/vocalparse-25s-score/staff.svg
          test -s /tmp/vocalparse-25s-score/jianpu.svg
          grep -q "如" /tmp/vocalparse-25s-score/staff.svg
      - name: Test lyric tokenization, MusicXML alignment, and ASR adapter
        run: python -m pytest -q tests/test_lyrics.py tests/test_lyric_asr.py
      - name: Check Python syntax
        run: python -m compileall -q musicmaster
      - name: Check frontend JavaScript syntax
        run: |
          node --check musicmaster/web/static/js/transcribe.js
          node --check musicmaster/web/static/js/convert.js
