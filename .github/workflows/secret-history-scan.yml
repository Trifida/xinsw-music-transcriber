name: Secret history scan

on:
  push:
    branches:
      - feat/manual-start-existing-gpu
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-history-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out complete Git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan all reachable Git history for leaked secrets
        run: |
          set -euo pipefail
          docker run --rm \
            -v "${PWD}:/repo" \
            zricethezav/gitleaks:v8.24.2 \
            detect \
            --source=/repo \
            --log-opts=--all \
            --redact \
            --verbose \
            --exit-code=1
